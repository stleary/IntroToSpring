plugins {
   id 'java'
   id 'com.github.johnrengelman.shadow' version '7.1.2'
   id 'org.springframework.boot' version '2.7.18'
   id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

java {
   sourceCompatibility = JavaVersion.VERSION_11
   targetCompatibility = JavaVersion.VERSION_11
}

repositories {
   mavenCentral()
}

dependencies {

   // Spring core DI; no Boot, no web, no Tomcat
   implementation 'org.springframework:spring-context:5.3.31'

   // JDBC support
   implementation 'org.springframework:spring-jdbc:5.3.31'

   // MySQL driver
   implementation('com.mysql:mysql-connector-j:8.0.33') {
      exclude group: 'com.google.protobuf', module: 'protobuf-java'
   }

   // AWS Lambda core
   implementation 'com.amazonaws:aws-lambda-java-core:1.2.2'
   implementation 'com.amazonaws:aws-lambda-java-events:3.11.1'

   // JSON processing for API Gateway request/response
   implementation 'com.google.code.gson:gson:2.10.1'

   implementation 'org.springframework.boot:spring-boot-starter-web:2.7.18'
   implementation 'org.springframework.boot:spring-boot-starter-jdbc:2.7.18'
   implementation 'org.springframework.boot:spring-boot-starter-security:2.7.18'
   implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:2.7.18'

   testImplementation 'junit:junit:4.13.2'
   // Test: SQLite for in-memory integration tests
   testImplementation 'org.xerial:sqlite-jdbc:3.42.0.0'
   testImplementation 'org.springframework.boot:spring-boot-starter-test'
   testImplementation 'org.springframework.security:spring-security-test'
}

shadowJar {
   archiveClassifier.set('aws')
   mergeServiceFiles()
   append 'META-INF/spring.handlers'
   append 'META-INF/spring.schemas'
}

build.dependsOn shadowJar

test {
   useJUnitPlatform()
   testLogging {
      events "passed", "failed", "skipped"
      showStandardStreams = true
   }
}